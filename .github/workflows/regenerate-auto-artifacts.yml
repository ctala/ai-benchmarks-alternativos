name: Regenerar artefactos auto-generados

# Cuando cambian los benchmark JSONs, el config, o los scripts de generación,
# regenera todos los artefactos auto-generables del repo:
#   - docs/data/models.json (calculadora HTML)
#   - docs/sitemap.xml (descubre landing pages + lastmod desde git)
#   - MODELOS.md (tabla con links a per-model + responses)
#   - TESTS.md (lista de 91 tests con prompts completos)
#
# La calculadora en GitHub Pages siempre refleja el último estado del repo
# sin trabajo manual.

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/results/*.json'
      - 'benchmarks/results/responses/**'
      - 'benchmarks/results/per-model/**'
      - 'benchmarks/models.py'
      - 'benchmarks/config.py'
      - 'benchmarks/export_for_pages.py'
      - 'benchmarks/generate_modelos_md_table.py'
      - 'benchmarks/generate_tests_md.py'
      - 'benchmarks/generate_sitemap.py'
      - 'benchmarks/scoring.py'
      - 'benchmarks/tests/**'
      - 'providers/adapters.py'
      - 'docs/**/*.html'
      # La calculadora es código a mano que consume el JSON generado. Si alguien la
      # edita, el guardrail `check_calculator.py` tiene que correr: el 13-ago-2026
      # quedaron 11 umbrales calibrados para una escala que ya no existía, y la página
      # cargaba igual sin una queja.
      - 'docs/app.js'
      - 'benchmarks/generate_readme_ranking.py'
      - 'benchmarks/generate_rankings.py'
      - 'benchmarks/generate_comparison.py'
  workflow_dispatch:  # permite re-correr manualmente

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Evita loop: si el commit fue del bot, no re-correr
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo para que generate_sitemap.py lea lastmod desde git log
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias mínimas
        run: |
          pip install python-dotenv

      # Tras refactor abril 2026: benchmarks/models.py + benchmarks/config.py
      # estan ambos en git. CI usa los mismos archivos que dev local. No se
      # copian ni sincronizan (eliminado config.example.py).

      - name: Regenerar docs/data/models.json
        run: python benchmarks/export_for_pages.py

      - name: Regenerar MODELOS.md (tabla con links)
        run: python benchmarks/generate_modelos_md_table.py -i

      - name: Regenerar Top-10 del README
        run: python benchmarks/generate_readme_ranking.py -i

      - name: Regenerar TESTS.md (prompts completos)
        run: python benchmarks/generate_tests_md.py -o TESTS.md

      - name: Regenerar docs/sitemap.xml
        # checkout@v4 con fetch-depth:0 ya nos da historial completo para git log lastmod
        run: python benchmarks/generate_sitemap.py

      # Guardrail: falla el build si un doc vivo publica un score que ya no
      # coincide con models.json. El score es z-score contra la poblacion, asi
      # que medir un modelo nuevo caduca toda cifra escrita a mano.
      - name: Verificar consistencia de scores en docs vivos
        run: python benchmarks/check_consistency.py

      # Guardrail de la calculadora. NO se regenera —es codigo a mano— pero consume
      # el JSON que este workflow acaba de reescribir. Cuando cambia la forma del
      # dato nadie le avisa: el 13-ago-2026 quedaron 11 umbrales calibrados para una
      # escala que ya no existia y el filtro por defecto dejaba pasar los 82 modelos.
      # La pagina cargaba igual. Este paso falla el build en ese caso.
      - name: Verificar que la calculadora sigue alineada con los datos
        run: python benchmarks/check_calculator.py

      # Control de versiones. El repo la declara en 6 superficies y el 13-ago-2026 dos
      # estaban desfasadas sin que nada fallara: no habia tag de v4.1 y el README
      # presentaba v4.0 como vigente.
      - name: Verificar que el repo declara una sola version de si mismo
        run: python benchmarks/check_version.py

      # Quis custodiet ipsos custodes. El repo tenia OCHO guardrails y CERO pruebas:
      # si uno se rompia, pasaba en verde y nadie se enteraba — el mismo modo de falla
      # que los guardrails vinieron a resolver, un nivel mas arriba. Esta prueba les
      # presenta una version rota del mundo y exige que fallen.
      - name: Probar que los guardrails cazan su propio fallo
        run: python benchmarks/test_guardrails.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/models.json docs/sitemap.xml MODELOS.md TESTS.md README.md
          if git diff --cached --quiet; then
            echo "Sin cambios en artefactos auto-generados"
          else
            git commit -m "chore: regenera artefactos auto-generados [skip ci]"
            git push
          fi
