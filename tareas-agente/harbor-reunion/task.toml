[task]
name = "ctala/reunion-socios-tablero-es"
description = "Actualizar el tablero de tareas desde la transcripción de una reunión entre dos socios: cerrar lo resuelto, cambiar prioridades y agregar lo nuevo. La transcripción tiene el ruido de una conversación real — algo que se da por cerrado y no lo está, una idea que se descarta después de proponerla, una cifra corregida y un alcance que nadie definió."
