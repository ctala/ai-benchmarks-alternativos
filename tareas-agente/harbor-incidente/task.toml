schema_version = "1.1"
artifacts = []

[task]
name = "ctala/diagnosticar-incidentes-es"
description = "Tres incidentes de operación «en verde pero no actuó» (n8n, Listmonk, NocoDB) con su log, exports y registro de cambios. En cada uno el síntoma apunta a otro lado —un token por vencer, un 535 que parece contraseña mala, un 429 de Postmark, un flujo copia inactivo— y la causa está en un archivo secundario. Hay que clasificar la causa en un conjunto cerrado y aplicar el arreglo sin tocar credenciales ni plantillas aprobadas."
keywords = ["operations", "spanish", "debugging", "incident-response", "n8n"]
[[task.authors]]
name = "Cristian Tala"

[metadata]
difficulty = "hard"
category = "business"
tags = ["es", "incident-diagnosis", "silent-failure", "instruction-adherence"]
expert_time_estimate_min = 20.0
junior_time_estimate_min = 60.0

