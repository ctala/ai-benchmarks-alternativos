[task]
name = "ctala/conciliacion-bancaria-es"
description = "Conciliar la cartola bancaria de una pyme chilena contra sus facturas: un pago parcial, un abono que cubre dos facturas y no alcanza, facturas en USD pagadas en CLP (una en fin de semana), una filial que paga con su RUT, un abono de otro cliente que cita un folio ajeno, una devolución del fisco con el mismo monto que una factura y cargos bancarios que citan folios. Cada error cobra de más o da por cobrada una deuda viva."
keywords = ["business", "spanish", "rules-following", "accounting", "reconciliation"]
[[task.authors]]
name = "Cristian Tala"

